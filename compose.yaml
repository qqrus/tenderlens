services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenderlens}
      POSTGRES_USER: ${POSTGRES_USER:-tenderlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderlens}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderlens} -d ${POSTGRES_DB:-tenderlens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      APP_NAME: ${APP_NAME:-TenderLens API}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8501"]}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tenderlens:tenderlens@postgres:5432/tenderlens}
      UPLOAD_DIR: ${UPLOAD_DIR:-data/uploads}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-300}
      CHUNK_SIZE_CHARS: ${CHUNK_SIZE_CHARS:-1600}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-200}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-data/models}
      RETRIEVAL_DENSE_K: ${RETRIEVAL_DENSE_K:-20}
      RETRIEVAL_LEXICAL_K: ${RETRIEVAL_LEXICAL_K:-20}
      RETRIEVAL_FINAL_K: ${RETRIEVAL_FINAL_K:-5}
      RRF_K: ${RRF_K:-60}
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      QA_EVIDENCE_LIMIT: ${QA_EVIDENCE_LIMIT:-5}
      QA_MAX_CLAIMS: ${QA_MAX_CLAIMS:-5}
      ANALYSIS_RETRIEVAL_LIMIT: ${ANALYSIS_RETRIEVAL_LIMIT:-8}
      ANALYSIS_MAX_ITEMS_PER_CATEGORY: ${ANALYSIS_MAX_ITEMS_PER_CATEGORY:-5}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
      - models_data:/app/data/models
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  models_data:
